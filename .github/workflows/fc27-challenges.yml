name: FC27 Objectives, SBC and Evolution Feed
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync-fc27-challenges.cjs'
      - 'scripts/sync-fc27-evolutions.cjs'
      - 'scripts/lib/futgg.cjs'
      - '.github/workflows/fc27-challenges.yml'
  schedule:
    - cron: '19 6,12,18 * * *'
concurrency:
  group: fc27-challenges-sync
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect verified FC27 objectives and SBCs
        run: node scripts/sync-fc27-challenges.cjs
      - name: Collect verified FC27 evolution levels
        run: node scripts/sync-fc27-evolutions.cjs
      - name: Commit validated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fc27-challenges.json data/fc27-evolutions.json
          if ! git diff --cached --quiet; then
            git commit -m "data(fc27): update sourced objectives, sbcs and evolutions"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
