name: Download Player Images

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many missing portraits to fetch, highest rated first'
        required: false
        default: '600'
  schedule:
    - cron: '11 3 * * *'
permissions:
  contents: write
concurrency:
  group: fc27-portrait-cdn-sync
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch current FC 27 portraits
        env:
          FC27_PORTRAIT_LIMIT: ${{ github.event.inputs.limit }}
        run: node scripts/sync-fc27-portraits.mjs

      - name: Count images
        run: |
          echo "Total images in img/players/: $(ls img/players/*.png 2>/dev/null | wc -l)"
          echo "Indexed portraits: $(node -e "process.stdout.write(String(require('./data/available-portraits.json').count))")"

      - name: Commit portraits, index and provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add img/players data/available-portraits.json data/external-portraits.json
          if git diff --staged --quiet; then
            echo "No new images to commit"
          else
            ADDED=$(git diff --staged --name-only -- img/players | grep -c '\.png' || true)
            git commit -m "images(fc27): add $ADDED current-edition portraits from the FUTBIN CDN [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
