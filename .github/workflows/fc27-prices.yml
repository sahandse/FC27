name: FC27 Verified Card Prices
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe-fc27-price-sources.mjs'
      - 'scripts/sync-fc27-prices.ts'
      - 'scripts/sync-fc27-prices-futgg.mjs'
      - 'scripts/sync-fc27-prices-live.mjs'
      - '.github/workflows/fc27-prices.yml'
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
concurrency:
  group: fc27-verified-prices
  cancel-in-progress: false
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Probe public market catalogue reachability
        run: node scripts/probe-fc27-price-sources.mjs
      - name: Refresh from the configured private feed
        if: ${{ vars.FC27_PRICE_FEED_URL != '' }}
        env:
          FC27_PRICE_FEED_URL: ${{ vars.FC27_PRICE_FEED_URL }}
          FC27_PRICE_FEED_TOKEN: ${{ secrets.FC27_PRICE_FEED_TOKEN }}
        run: node --experimental-strip-types scripts/sync-fc27-prices.ts
      - name: Refresh from the public FUT.GG CDN price blobs
        if: ${{ vars.FC27_PRICE_FEED_URL == '' }}
        env:
          FC27_PRICE_STALE_MINUTES: '720'
        run: node scripts/sync-fc27-prices-futgg.mjs
      - name: Publish only verified data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fc27-prices.json
          if ! git diff --cached --quiet; then
            git commit -m "data(fc27): refresh verified card prices"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase --autostash FETCH_HEAD
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
      - name: Publish the price snapshot to Pages when coin values change
        run: |
          git fetch origin gh-pages
          base="$(mktemp -d)"
          worktree="$base/wt"
          git worktree add --detach "$worktree" FETCH_HEAD
          unchanged=$(node -e '
            const fs = require("fs");
            const sig = f => JSON.stringify((JSON.parse(fs.readFileSync(f, "utf8")).prices || [])
              .map(q => [q.cardId, q.versionId, q.platform, q.coins]));
            console.log(sig("data/fc27-prices.json") === sig(process.argv[1] + "/data/fc27-prices.json") ? "yes" : "no");
          ' "$worktree")
          if [ "$unchanged" = "yes" ]; then
            echo "Coin values unchanged; the Pages snapshot is already current."
            exit 0
          fi
          cp data/fc27-prices.json "$worktree/data/fc27-prices.json"
          cd "$worktree"
          git add data/fc27-prices.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "data(fc27): publish verified price snapshot"
          git push origin HEAD:gh-pages
  card-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Index FC27 card artwork paths from FUT.GG
        env:
          FC27_ART_DELAY_MS: '400'
        run: node scripts/sync-fc27-card-art.mjs
      - name: Commit card-art index only when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fc27-card-art.json
          if ! git diff --cached --quiet; then
            git commit -m "data(fc27): refresh card-art index"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase --autostash FETCH_HEAD
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
